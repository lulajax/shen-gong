spring:
  application:
    name: agent-runtime

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

# LangChain4j Configuration
langchain4j:
  # 模型提供商选择: openai, gemini
  model:
    provider: openai           # 切换此值即可更换模型提供商

  # OpenAI 默认主模型
  open-ai:
    api-key: ${OPENAI_API_KEY:}
    model-name: gpt-4
    temperature: 0.7
    max-tokens: 2000
    timeout: 120s
    log-requests: true
    log-responses: true

  # Google Gemini 作为备用
  google-ai-gemini:
    api-key: ${GEMINI_API_KEY:}
    model-name: gemini-2.5-flash
    temperature: 0.7
    max-tokens: 8192
    timeout: 120s
    log-requests: true
    log-responses: true

  # HTTP/SOCKS 代理配置
  proxy:
    enabled: true              # 是否启用代理
    host: 127.0.0.1            # 代理主机
    port: 10808                 # 代理端口
    type: HTTP                 # 代理类型: HTTP 或 SOCKS

#  Configuration
agent-runtime:
  # MCP Proxy Configuration
  mcp:
    proxy:
      url: http://localhost:3000
      timeout: 30s
      enabled: false

  # Rate Limit Configuration
  rate-limit:
    enabled: true
    qps: 1000

  # Execution Configuration
  execution:
    async-enabled: true
    thread-pool-size: 10
    max-queue-size: 100
    timeout: 300000

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

# Logging
logging:
  level:
    root: INFO
    com.shengong: DEBUG
    dev.langchain4j: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/agent-runtime.log
    max-size: 100MB
    max-history: 30

# Server Configuration
server:
  port: 8089
  servlet:
    context-path: /
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# CORS 配置说明
# CORS 策略在 CorsConfig.java 中配置